mutation createReservation($listId: Int!, $checkIn: String!, $checkOut: String!, $guests: Int!, $message: String!, $basePrice: Float!, $cleaningPrice: Float!, $currency: String!, $discount: Float, $discountType: String, $guestServiceFee: Float, $hostServiceFee: Float, $total: Float!, $bookingType: String, $cardToken: String!, $paymentType: Int , $convCurrency: String!, $averagePrice: Float, $nights: Int, $paymentCurrency: String,$threadId: Int) {
  createReservation(listId: $listId, checkIn: $checkIn, checkOut: $checkOut, guests: $guests, message: $message, basePrice: $basePrice, cleaningPrice: $cleaningPrice, currency: $currency, discount: $discount, discountType: $discountType, guestServiceFee: $guestServiceFee, hostServiceFee: $hostServiceFee, total: $total, bookingType: $bookingType, cardToken: $cardToken, paymentType: $paymentType, convCurrency: $convCurrency, averagePrice: $averagePrice, nights: $nights, paymentCurrency: $paymentCurrency,threadId: $threadId) {
    results {
      id
      listId
      hostId
      guestId
      checkIn
      checkOut
      guests
      message
      basePrice
      cleaningPrice
      currency
      discount
      discountType
      guestServiceFee
      hostServiceFee
      total
      confirmationCode
      createdAt
      reservationState
      paymentState
    }
    status
    errorMessage
    requireAdditionalAction
    paymentIntentSecret
    reservationId
    redirectUrl
  }
}




mutation confirmReservation($reservationId: Int!, $paymentIntentId: String!) {
  confirmReservation(reservationId: $reservationId, paymentIntentId: $paymentIntentId) {
    results {
      id
      listId
      hostId
      guestId
      checkIn
      checkOut
      guests
      message
      basePrice
      cleaningPrice
      currency
      discount
      discountType
      guestServiceFee
      hostServiceFee
      total
      confirmationCode
      createdAt
      reservationState
      paymentState
    }
    status
    errorMessage
    requireAdditionalAction
    paymentIntentSecret
    reservationId
  }
}

